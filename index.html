<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-shell">
        <header class="hero">
            <div>
                <h1>Motion</h1>
                <p>Plan alpine hikes with trail weather, safety checks, wind & rain analytics, and active alerts.</p>
            </div>
            <div class="selector-panel">
                <label for="city-select">Select a region</label>
                <select id="city-select"></select>
            </div>
        </header>

        <nav class="tabs" aria-label="Main navigation">
            <a class="tab active" href="index.html">Overview</a>
            <a class="tab" href="trailMap.html">Trail Map</a>
            <a class="tab" href="elevationForecast.html">Elevation Forecast</a>
            <a class="tab" href="windRain.html">Wind & Rain</a>
            <a class="tab" href="safety.html">Safety</a>
            <a class="tab" href="alerts.html">Alerts</a>
        </nav>

        <main>
            <section id="overview" class="page-section">
                <div class="hero-banner">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=60" alt="Live trail" />
                    <div class="hero-overlay">
                        <div class="overview-stats">
                            <div id="current-conditions" class="grid dashboard-grid"></div>
                        </div>
                        <div class="overview-controls">
                            <div class="card chart-card">
                                <h2>Hourly forecast</h2>
                                <div id="hourly-chart" class="chart-container"></div>
                            </div>
                            <div class="card chart-card">
                                <h2>7-day mountain forecast</h2>
                                <div id="seven-day" class="forecast-grid"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script type="module" src="scripts.js"></script>
</body>
</html>
